                            className="w-full border-2 border-gray-300 px-4 py-3 rounded-lg outline-none focus:border-black"
                            rows="4"
                            style={{ fontFamily: '"Outfit", sans-serif' }}
                          />
                        </div>

                        {/* Close Button */}
                        <button
                          onClick={() => setExerciseDetailModal(null)}
                          className="w-full bg-black text-white py-3 border-2 border-black hover:shadow-xl transition-shadow"
                          style={{
                            borderRadius: '12px',
                            fontFamily: '"Outfit", sans-serif',
                            fontSize: '16px',
                            fontWeight: '600',
                            boxShadow: '3px 3px 0px 0px rgba(0,0,0,1)'
                          }}
                        >
                          Kaydet
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })()}

              {/* Add Exercise Button */}
              <button
                onClick={() => addExerciseToDay(selectedDay)}
                className="fixed bottom-6 right-6 bg-black text-white w-14 h-14 flex items-center justify-center border-2 border-black hover:shadow-xl transition-shadow"
                style={{
                  borderRadius: '16px',
                  boxShadow: '4px 4px 0px 0px rgba(0,0,0,1)'
                }}
              >
                <Plus size={28} />
              </button>
            </div>
          );
        }

        // Active Workout View
        if (view === 'activeWorkout' && activeWorkout) {
          const completedCount = activeWorkout.exercises.filter(e => e.completed).length;
          const totalCount = activeWorkout.exercises.length;
          const restProgress = restTimer.total > 0
            ? Math.round(((restTimer.total - restTimer.remaining) / restTimer.total) * 100)
            : 0;

          return (
            <div className="min-h-screen p-4 pb-24" style={{
              background: 'linear-gradient(#e5e5e5 1px, transparent 1px), linear-gradient(90deg, #e5e5e5 1px, transparent 1px)',
              backgroundSize: '40px 40px',
              backgroundColor: '#f5f5f0'
            }}>
              {/* Header */}
              <div className="flex items-center justify-between mb-4 pt-4">
                <button
                  onClick={() => {
                    if (confirm('Antrenmandan çıkmak istediğinize emin misiniz?')) {
                      setActiveWorkout(null);
                      setWorkoutTime(0);
                      setRestTimer({ running: false, remaining: 0, total: 0 });
                      setView('home');
                    }
                  }}
                  className="w-10 h-10 flex items-center justify-center border-2 border-black"
                  style={{ borderRadius: '8px' }}
                >
                  <ChevronLeft size={24} />
                </button>

                <div className="text-center">
                  <h1 className="text-2xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                    {activeWorkout.dayName}
                  </h1>
                  <p className="text-sm text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                    {completedCount} / {totalCount} tamamlandı
                  </p>
                </div>

                <div className="w-10" />
              </div>

              {/* Timer */}
              <div className="bg-white border-2 border-black p-4 mb-6 text-center" style={{ borderRadius: '12px' }}>
                <div className="text-4xl font-bold mb-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                  {formatTime(workoutTime)}
                </div>
                <div className="text-sm text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                  süre
                </div>
              </div>

              {/* Rest Timer */}
              <div className="bg-white border-2 border-black p-4 mb-6" style={{ borderRadius: '12px' }}>
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-lg font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                    Dinlenme Zamanlayıcı
                  </h3>
                  {restTimer.total > 0 && (
                    <button
                      onClick={stopRest}
                      className="text-xs px-2 py-1 border-2 border-black"
                      style={{ borderRadius: '999px', fontFamily: '"Outfit", sans-serif' }}
                    >
                      Sıfırla
                    </button>
                  )}
                </div>

                {restTimer.total === 0 ? (
                  <div className="flex flex-wrap gap-2">
                    <button
                      onClick={() => startRest(settings.restSeconds || 90)}
                      className="px-3 py-2 border-2 border-black bg-black text-white"
                      style={{ borderRadius: '10px', fontFamily: '"Outfit", sans-serif' }}
                    >
                      Hızlı ({settings.restSeconds || 90}s)
                    </button>
                    {[60, 90, 120].map((sec) => (
                      <button
                        key={sec}
                        onClick={() => startRest(sec)}
                        className="px-3 py-2 border-2 border-black"
                        style={{ borderRadius: '10px', fontFamily: '"Outfit", sans-serif' }}
                      >
                        {sec}s
                      </button>
                    ))}
                  </div>
                ) : (
                  <div>
                    <div className="text-3xl font-bold mb-2 text-center" style={{ fontFamily: '"Outfit", sans-serif' }}>
                      {formatShortTime(restTimer.remaining)}
                    </div>
                    <div className="w-full h-3 border-2 border-black bg-white mb-3" style={{ borderRadius: '999px' }}>
                      <div
                        className="h-full bg-black"
                        style={{ width: `${restProgress}%`, borderRadius: '999px' }}
                      />
                    </div>
                    <div className="flex gap-2">
                      <button
                        onClick={toggleRest}
                        className="flex-1 py-2 border-2 border-black flex items-center justify-center gap-2"
                        style={{ borderRadius: '10px', fontFamily: '"Outfit", sans-serif' }}
                      >
                        {restTimer.running ? <Pause size={18} /> : <Play size={18} />}
                        {restTimer.running ? 'Duraklat' : 'Devam'}
                      </button>
                      <button
                        onClick={stopRest}
                        className="flex-1 py-2 border-2 border-black bg-white"
                        style={{ borderRadius: '10px', fontFamily: '"Outfit", sans-serif' }}
                      >
                        Bitir
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {/* Exercises */}
              <div className="space-y-4 mb-6">
                {activeWorkout.exercises.map((exercise, index) => (
                  <div
                    key={exercise.id}
                    className={`bg-white border-2 border-black p-4 transition-all ${exercise.completed ? 'opacity-60' : ''}`}
                    style={{
                      borderRadius: '12px',
                      boxShadow: exercise.completed ? 'none' : '3px 3px 0px 0px rgba(0,0,0,1)'
                    }}
                  >
                    <div className="flex items-start gap-3">
                      <button
                        onClick={() => toggleExerciseComplete(exercise.id)}
                        className={`w-8 h-8 border-2 border-black flex items-center justify-center flex-shrink-0 ${exercise.completed ? 'bg-black' : 'bg-white'
                          }`}
                        style={{ borderRadius: '50%' }}
                      >
                        {exercise.completed && <Check size={20} color="white" strokeWidth={3} />}
                      </button>

                      <div className="flex-1">
                        <h3
                          className={`text-xl font-bold mb-3 ${exercise.completed ? 'line-through' : ''}`}
                          style={{ fontFamily: '"Outfit", sans-serif' }}
                        >
                          {index + 1}. {exercise.name}
                        </h3>

                        <div className="grid grid-cols-2 gap-2">
                          <div className="border-2 border-gray-300 p-2 text-center" style={{ borderRadius: '8px' }}>
                            <div className="text-xs text-gray-500 mb-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                              SETS × REPS
                            </div>
                            <div className="text-xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                              {exercise.sets} × {exercise.reps}
                            </div>
                          </div>

                          {exercise.weight > 0 && (
                            <div className="border-2 border-gray-300 p-2 text-center" style={{ borderRadius: '8px' }}>
                              <div className="text-xs text-gray-500 mb-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                                AĞIRLIK
                              </div>
                              <div className="text-xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                                {exercise.weight} kg
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {/* Notes */}
              <div className="bg-yellow-100 border-2 border-yellow-600 p-4 mb-6"
                style={{
                  borderRadius: '12px',
                  boxShadow: '3px 3px 0px 0px rgba(202, 138, 4, 1)'
                }}
              >
                <div className="text-sm font-bold mb-2" style={{ fontFamily: '"Outfit", sans-serif' }}>
                  NOTLAR:
                </div>
                <textarea
                  value={activeWorkout.notes}
                  onChange={(e) => setActiveWorkout({ ...activeWorkout, notes: e.target.value })}
                  placeholder="Bugün nasıl hissettin?"
                  className="w-full bg-transparent outline-none resize-none"
                  style={{ fontFamily: '"Outfit", sans-serif', minHeight: '60px' }}
                />
              </div>

              {/* Finish Button */}
              <button
                onClick={finishWorkout}
                className="fixed bottom-6 left-4 right-4 bg-black text-white py-4 border-2 border-black hover:shadow-xl transition-shadow"
                style={{
                  borderRadius: '12px',
                  fontFamily: '"Outfit", sans-serif',
                  fontSize: '20px',
                  boxShadow: '4px 4px 0px 0px rgba(0,0,0,1)'
                }}
              >
                Antrenmayı Bitir
              </button>
            </div>
          );
        }

        // Stats View
        if (view === 'stats') {
          const streaks = getStreaks();
          const prs = getPRs().slice(0, 8);
          const dayLabels = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
          const last7Days = Array.from({ length: 7 }).map((_, i) => {
            const d = new Date();
            d.setDate(d.getDate() - (6 - i));
            const dayKey = getDateKey(d);
            const count = workoutHistory.filter(w => {
              const workoutKey = getDateKey(new Date(w.endTime || w.startTime));
              return workoutKey === dayKey;
            }).length;
            return {
              label: dayLabels[d.getDay()],
              count
            };
          });
          const maxCount = Math.max(1, ...last7Days.map(d => d.count));
          const heatmap = getMonthHeatmap(statsMonthOffset);
          const heatColors = ['#f0f0f0', '#c8e6c9', '#81c784', '#388e3c'];

          return (
            <div className="min-h-screen p-4" style={{
              background: 'linear-gradient(#e5e5e5 1px, transparent 1px), linear-gradient(90deg, #e5e5e5 1px, transparent 1px)',
              backgroundSize: '40px 40px',
              backgroundColor: '#f5f5f0'
            }}>
              {/* Header */}
              <div className="flex items-center justify-between mb-6 pt-4">
                <button
                  onClick={() => setView('home')}
                  className="w-10 h-10 flex items-center justify-center border-2 border-black"
                  style={{ borderRadius: '8px' }}
                >
                  <ChevronLeft size={24} />
                </button>

                <h1 className="text-2xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                  İstatistikler
                </h1>

                <div className="w-10" />
              </div>

              {/* Statistics Cards */}
              <div className="space-y-4 mb-6">
                {/* Total Workouts */}
                <div className="bg-white border-2 border-black p-5" style={{ borderRadius: '12px', boxShadow: '3px 3px 0px 0px rgba(0,0,0,1)' }}>
                  <div className="flex items-center gap-4">
                    <div className="w-16 h-16 bg-purple-200 border-2 border-black flex items-center justify-center" style={{ borderRadius: '12px' }}>
                      <BarChart3 size={28} />
                    </div>
                    <div>
                      <p className="text-sm text-gray-500 mb-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        Toplam Antrenman
                      </p>
                      <p className="text-4xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        {workoutHistory.length}
                      </p>
                    </div>
                  </div>
                </div>

                {/* Total Time */}
                <div className="bg-white border-2 border-black p-5" style={{ borderRadius: '12px', boxShadow: '3px 3px 0px 0px rgba(0,0,0,1)' }}>
                  <div className="flex items-center gap-4">
                    <div className="w-16 h-16 bg-blue-200 border-2 border-black flex items-center justify-center" style={{ borderRadius: '12px' }}>
                      <Clock size={28} />
                    </div>
                    <div>
                      <p className="text-sm text-gray-500 mb-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        Toplam Süre
                      </p>
                      <p className="text-4xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        {Math.floor(workoutHistory.reduce((sum, w) => sum + w.duration, 0) / 60)} <span className="text-2xl">dk</span>
                      </p>
                    </div>
                  </div>
                </div>

                {/* This Week */}
                <div className="bg-white border-2 border-black p-5" style={{ borderRadius: '12px', boxShadow: '3px 3px 0px 0px rgba(0,0,0,1)' }}>
                  <div className="flex items-center gap-4">
                    <div className="w-16 h-16 bg-green-200 border-2 border-black flex items-center justify-center" style={{ borderRadius: '12px' }}>
                      <Calendar size={28} />
                    </div>
                    <div>
                      <p className="text-sm text-gray-500 mb-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        Bu Hafta
                      </p>
                      <p className="text-4xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        {workoutHistory.filter(w => {
                          const workoutDate = new Date(w.endTime);
                          const now = new Date();
                          const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                          return workoutDate >= weekAgo;
                        }).length}
                      </p>
                    </div>
                  </div>
                </div>

                {/* This Month */}
                <div className="bg-white border-2 border-black p-5" style={{ borderRadius: '12px', boxShadow: '3px 3px 0px 0px rgba(0,0,0,1)' }}>
                  <div className="flex items-center gap-4">
                    <div className="w-16 h-16 bg-orange-200 border-2 border-black flex items-center justify-center" style={{ borderRadius: '12px' }}>
                      <Calendar size={28} />
                    </div>
                    <div>
                      <p className="text-sm text-gray-500 mb-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        Bu Ay
                      </p>
                      <p className="text-4xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        {workoutHistory.filter(w => {
                          const workoutDate = new Date(w.endTime);
                          const now = new Date();
                          return workoutDate.getMonth() === now.getMonth() && workoutDate.getFullYear() === now.getFullYear();
                        }).length}
                      </p>
                    </div>
                  </div>
                </div>

                {/* Streaks */}
                <div className="bg-white border-2 border-black p-5" style={{ borderRadius: '12px', boxShadow: '3px 3px 0px 0px rgba(0,0,0,1)' }}>
                  <div className="flex items-center gap-4">
                    <div className="w-16 h-16 bg-yellow-200 border-2 border-black flex items-center justify-center" style={{ borderRadius: '12px' }}>
                      <Clock size={28} />
                    </div>
                    <div>
                      <p className="text-sm text-gray-500 mb-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        Seri
                      </p>
                      <p className="text-2xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        Şu an: {streaks.current} gün
                      </p>
                      <p className="text-sm text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        En iyi: {streaks.best} gün
                      </p>
                    </div>
                  </div>
                </div>

                {/* Last 7 Days Chart */}
                <div className="bg-white border-2 border-black p-5" style={{ borderRadius: '12px', boxShadow: '3px 3px 0px 0px rgba(0,0,0,1)' }}>
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-lg font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                      Son 7 Gün
                    </h3>
                    <span className="text-xs text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                      antrenman sayısı
                    </span>
                  </div>
                  <div className="flex items-end gap-2 h-28">
                    {last7Days.map((day) => (
                      <div key={day.label} className="flex-1 flex flex-col items-center gap-2">
                        <div
                          className="w-full bg-black"
                          style={{
                            height: `${Math.max(8, Math.round((day.count / maxCount) * 100))}%`,
                            borderRadius: '6px'
                          }}
                        />
                        <div className="text-xs text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                          {day.label}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* PRs */}
                <div className="bg-white border-2 border-black p-5" style={{ borderRadius: '12px', boxShadow: '3px 3px 0px 0px rgba(0,0,0,1)' }}>
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="text-lg font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                      Kişisel Rekorlar
                    </h3>
                    <span className="text-xs text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                      en iyi değerler
                    </span>
                  </div>
                  {prs.length === 0 ? (
                    <div className="text-sm text-gray-400" style={{ fontFamily: '"Outfit", sans-serif' }}>
                      Henüz yeterli veri yok.
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {prs.map((pr) => (
                        <div key={pr.name} className="flex items-center justify-between text-sm">
                          <span className="font-semibold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                            {pr.name}
                          </span>
                          <span className="text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                            {pr.maxWeight > 0 ? `${pr.maxWeight}kg` : `${pr.maxReps} tekrar`}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Month Heatmap */}
                <div className="bg-white border-2 border-black p-5" style={{ borderRadius: '12px', boxShadow: '3px 3px 0px 0px rgba(0,0,0,1)' }}>
                  <div className="flex items-center justify-between mb-3">
                    <button
                      onClick={() => setStatsMonthOffset(prev => prev - 1)}
                      className="w-8 h-8 flex items-center justify-center border-2 border-black"
                      style={{ borderRadius: '8px' }}
                    >
                      <ChevronLeft size={16} />
                    </button>
                    <h3 className="text-lg font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                      {heatmap.monthLabel}
                    </h3>
                    <button
                      onClick={() => setStatsMonthOffset(prev => prev + 1)}
                      className="w-8 h-8 flex items-center justify-center border-2 border-black"
                      style={{ borderRadius: '8px' }}
                    >
                      <ChevronLeft size={16} className="rotate-180" />
                    </button>
                  </div>
                  <div className="grid grid-cols-7 gap-2 mb-3">
                    {['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'].map((label) => (
                      <div key={label} className="text-[10px] text-gray-400 text-center" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        {label}
                      </div>
                    ))}
                    {heatmap.cells.map((cell, idx) => {
                      const level = cell ? Math.min(3, cell.count) : 0;
                      const bg = cell ? heatColors[level] : 'transparent';
                      return (
                        <div
                          key={idx}
                          className="border-2 border-black"
                          style={{
                            width: '100%',
                            aspectRatio: '1 / 1',
                            borderRadius: '6px',
                            backgroundColor: bg,
                            borderColor: 'rgba(0,0,0,0.2)',
                            opacity: cell ? 1 : 0
                          }}
                          title={cell ? `${cell.day}. gün • ${cell.count} antrenman` : ''}
                        />
                      );
                    })}
                  </div>
                  <div className="flex items-center gap-2 text-xs text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                    <span>Az</span>
                    <div className="flex gap-1">
                      {heatColors.map((color, i) => (
                        <div key={i} style={{ width: 12, height: 12, backgroundColor: color, borderRadius: 3, border: '1px solid #111' }} />
                      ))}
                    </div>
                    <span>Çok</span>
                  </div>
                </div>
              </div>

              {/* View History Button */}
              <button
                onClick={() => setView('history')}
                className="w-full bg-white border-2 border-black py-4 hover:shadow-xl transition-shadow flex items-center justify-center gap-2"
                style={{
                  borderRadius: '12px',
                  fontFamily: '"Outfit", sans-serif',
                  fontSize: '16px',
                  fontWeight: '600',
                  boxShadow: '3px 3px 0px 0px rgba(0,0,0,1)'
                }}
              >
                <Archive size={20} />
                Geçmişi Görüntüle
              </button>
            </div>
          );
        }

        // History View
        if (view === 'history') {
          return (
            <div className="min-h-screen p-4" style={{
              background: 'linear-gradient(#e5e5e5 1px, transparent 1px), linear-gradient(90deg, #e5e5e5 1px, transparent 1px)',
              backgroundSize: '40px 40px',
              backgroundColor: '#f5f5f0'
            }}>
              {/* Header */}
              <div className="flex items-center justify-between mb-6 pt-4">
                <button
                  onClick={() => setView('home')}
                  className="w-10 h-10 flex items-center justify-center border-2 border-black"
                  style={{ borderRadius: '8px' }}
                >
                  <ChevronLeft size={24} />
                </button>

                <h1 className="text-2xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                  Geçmiş Antrenmanlar
                </h1>

                <div className="w-10" />
              </div>

              {workoutHistory.length === 0 ? (
                <div className="text-center py-16">
                  <p className="text-xl" style={{ fontFamily: '"Outfit", sans-serif', color: '#999' }}>
                    henüz antrenman kaydı yok...
                  </p>
                </div>
              ) : (
                <div className="space-y-4">
                  {workoutHistory.map((workout) => {
                    const completedCount = workout.exercises.filter(e => e.completed).length;
                    const totalCount = workout.exercises.length;
                    const isExpanded = expandedWorkoutId === workout.id;

                    return (
                      <div
                        key={workout.id}
                        onClick={() => setExpandedWorkoutId(isExpanded ? null : workout.id)}
                        className="bg-white border-2 border-black p-4 cursor-pointer"
                        style={{
                          borderRadius: '12px',
                          boxShadow: '2px 2px 0px 0px rgba(0,0,0,1)'
                        }}
                      >
                        <div className="flex items-start justify-between mb-3">
                          <div>
                            <h3 className="text-xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                              {workout.dayName}
                            </h3>
                            <p className="text-sm text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                              {formatDate(workout.startTime)}
                            </p>
                          </div>
                          <div className="text-right">
                            <div className="text-lg font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                              {formatTime(workout.duration)}
                            </div>
                            <p className="text-xs text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                              {completedCount}/{totalCount} tamamlandı
                            </p>
                          </div>
                        </div>

                        {workout.notes && (
                          <div className="bg-yellow-50 border-2 border-yellow-300 p-2 mt-2" style={{ borderRadius: '6px' }}>
                            <p className="text-sm" style={{ fontFamily: '"Outfit", sans-serif' }}>
                              {workout.notes}
                            </p>
                          </div>
                        )}

                        {isExpanded && (
                          <div className="mt-3 border-t-2 border-gray-200 pt-3 space-y-2">
                            {workout.exercises.map((exercise) => (
                              <div key={exercise.id} className="flex items-center justify-between text-sm">
                                <span style={{ fontFamily: '"Outfit", sans-serif' }}>
                                  {exercise.completed ? '✓' : '○'} {exercise.name}
                                </span>
                                <span className="text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                                  {exercise.sets}×{exercise.reps}{exercise.weight > 0 ? ` • ${exercise.weight}kg` : ''}
                                </span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        }

        // Settings View
        if (view === 'settings') {
          return (
            <div className="min-h-screen p-4" style={{
              background: 'linear-gradient(#e5e5e5 1px, transparent 1px), linear-gradient(90deg, #e5e5e5 1px, transparent 1px)',
              backgroundSize: '40px 40px',
              backgroundColor: '#f5f5f0'
            }}>
              {/* Header */}
              <div className="flex items-center justify-between mb-6 pt-4">
                <button
                  onClick={() => setView('home')}
                  className="w-10 h-10 flex items-center justify-center border-2 border-black"
                  style={{ borderRadius: '8px' }}
                >
                  <ChevronLeft size={24} />
                </button>

                <h1 className="text-2xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                  Ayarlar
                </h1>

                <div className="w-10" />
              </div>

              <div className="space-y-4">
                {/* Program Name */}
                <div className="bg-white border-2 border-black p-4" style={{ borderRadius: '12px' }}>
                  <label className="text-sm text-gray-500 block mb-2" style={{ fontFamily: '"Outfit", sans-serif' }}>
                    Program Adı
                  </label>
                  <input
                    type="text"
                    value={program.name}
                    onChange={(e) => {
                      const updated = { ...program, name: e.target.value };
                      saveProgram(updated);
                    }}
                    className="w-full text-xl font-bold bg-transparent outline-none border-b-2 border-gray-300 pb-2"
                    style={{ fontFamily: '"Outfit", sans-serif' }}
                  />
                </div>

                {/* Goals */}
                <div className="bg-white border-2 border-black p-4" style={{ borderRadius: '12px' }}>
                  <label className="text-sm text-gray-500 block mb-3" style={{ fontFamily: '"Outfit", sans-serif' }}>
                    Hedefler
                  </label>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs text-gray-400 block mb-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        Haftalık Hedef
                      </label>
                      <input
                        type="number"
                        min="1"
                        value={settings.weeklyGoal}
                        onChange={(e) => {
                          const next = Math.max(1, parseInt(e.target.value, 10) || 1);
                          saveSettings({ ...settings, weeklyGoal: next });
                        }}
                        className="w-full border-2 border-gray-300 px-3 py-2 rounded-lg outline-none focus:border-black"
                        style={{ fontFamily: '"Outfit", sans-serif' }}
                      />
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                        Dinlenme (sn)
                      </label>
                      <input
                        type="number"
                        min="10"
                        value={settings.restSeconds}
                        onChange={(e) => {
                          const next = Math.max(10, parseInt(e.target.value, 10) || 10);
                          saveSettings({ ...settings, restSeconds: next });
                        }}
                        className="w-full border-2 border-gray-300 px-3 py-2 rounded-lg outline-none focus:border-black"
                        style={{ fontFamily: '"Outfit", sans-serif' }}
                      />
                    </div>
                  </div>
                </div>

                {/* Templates */}
                <button
                  onClick={() => setView('templates')}
                  className="w-full bg-white border-2 border-black py-3 hover:shadow-lg transition-shadow flex items-center justify-center gap-2"
                  style={{
                    borderRadius: '10px',
                    fontFamily: '"Outfit", sans-serif',
                    fontSize: '16px',
                    fontWeight: '600',
                    boxShadow: '2px 2px 0px 0px rgba(0,0,0,1)'
                  }}
                >
                  Şablon Kütüphanesi
                </button>

                {/* Reset Program */}
                <button
                  onClick={() => {
                    if (confirm('Tüm programı sıfırlamak istediğinize emin misiniz? Bu işlem geri alınamaz!')) {
                      const reset = createDefaultProgram();
                      reset.id = program.id;
                      reset.name = program.name;
                      saveProgram(reset);
                      alert('Program sıfırlandı!');
                    }
                  }}
                  className="w-full bg-white border-2 border-red-500 text-red-500 py-3 hover:bg-red-50"
                  style={{
                    borderRadius: '10px',
                    fontFamily: '"Outfit", sans-serif',
                    fontSize: '16px'
                  }}
                >
                  Programı Sıfırla
                </button>

                {/* Clear History */}
                <button
                  onClick={() => {
                    if (confirm('Tüm antrenman geçmişini silmek istediğinize emin misiniz?')) {
                      saveHistory([]);
                      alert('Geçmiş silindi!');
                    }
                  }}
                  className="w-full bg-white border-2 border-red-500 text-red-500 py-3 hover:bg-red-50"
                  style={{
                    borderRadius: '10px',
                    fontFamily: '"Outfit", sans-serif',
                    fontSize: '16px'
                  }}
                >
                  Geçmişi Sil
                </button>
              </div>

              {/* Info */}
              <div className="mt-8 text-center">
                <p className="text-sm text-gray-400" style={{ fontFamily: '"Outfit", sans-serif' }}>
                  Workout Tracker v1.0
                </p>
                <p className="text-xs text-gray-400 mt-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                  keep pushing! 💪
                </p>
              </div>
            </div>
          );
        }

        // Templates View
        if (view === 'templates') {
          return (
            <div className="min-h-screen p-4 pb-24" style={{
              background: 'linear-gradient(#e5e5e5 1px, transparent 1px), linear-gradient(90deg, #e5e5e5 1px, transparent 1px)',
              backgroundSize: '40px 40px',
              backgroundColor: '#f5f5f0'
            }}>
              {/* Header */}
              <div className="flex items-center justify-between mb-6 pt-4">
                <button
                  onClick={() => setView('settings')}
                  className="w-10 h-10 flex items-center justify-center border-2 border-black"
                  style={{ borderRadius: '8px' }}
                >
                  <ChevronLeft size={24} />
                </button>

                <h1 className="text-2xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                  Şablon Kütüphanesi
                </h1>

                <div className="w-10" />
              </div>

              <div className="text-sm text-gray-500 mb-4" style={{ fontFamily: '"Outfit", sans-serif' }}>
                Bir günü şablon olarak kaydetmek için gün düzenleme ekranındaki “Bu günü kaydet” butonunu kullan.
              </div>

              {templates.length === 0 ? (
                <div className="text-center py-16">
                  <p className="text-xl" style={{ fontFamily: '"Outfit", sans-serif', color: '#999' }}>
                    henüz şablon yok...
                  </p>
                </div>
              ) : (
                <div className="space-y-4">
                  {templates.map((template) => (
                    <div
                      key={template.id}
                      className="bg-white border-2 border-black p-4"
                      style={{
                        borderRadius: '12px',
                        boxShadow: '2px 2px 0px 0px rgba(0,0,0,1)'
                      }}
                    >
                      <div className="flex items-start justify-between mb-2">
                        <div className="flex-1">
                          <h3 className="text-xl font-bold mb-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                            {template.name}
                          </h3>
                          <p className="text-sm text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                            {template.exercises.length} egzersiz
                          </p>
                        </div>
                        <div className="flex items-center gap-1">
                          <button
                            onClick={() => {
                              setModalState({
                                isOpen: true,
                                title: 'Şablonu Yeniden Adlandır',
                                placeholder: 'Şablon Adı',
                                initialValue: template.name,
                                onConfirm: (name) => {
                                  if (name) {
                                    renameTemplate(template.id, name);
                                  }
                                }
                              });
                            }}
                            className="p-2 hover:bg-gray-50 rounded"
                          >
                            <Edit2 size={18} />
                          </button>
                          <button
                            onClick={() => {
                              if (confirm(`"${template.name}" şablonunu silmek istediğinize emin misiniz?`)) {
                                deleteTemplate(template.id);
                              }
                            }}
                            className="p-2 hover:bg-red-50 rounded"
                          >
                            <Trash2 size={18} className="text-red-500" />
                          </button>
                        </div>
                      </div>

                      {template.exercises.length > 0 && (
                        <div className="text-sm text-gray-600 space-y-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                          {template.exercises.slice(0, 4).map((exercise) => (
                            <div key={exercise.id}>• {exercise.name}</div>
                          ))}
                          {template.exercises.length > 4 && (
                            <div className="text-xs text-gray-400">+ {template.exercises.length - 4} egzersiz daha</div>
                          )}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        }

        // Programs View
        if (view === 'programs') {
          return (
            <div className="min-h-screen p-4 pb-24" style={{
              background: 'linear-gradient(#e5e5e5 1px, transparent 1px), linear-gradient(90deg, #e5e5e5 1px, transparent 1px)',
              backgroundSize: '40px 40px',
              backgroundColor: '#f5f5f0'
            }}>
              {/* Header */}
              <div className="flex items-center justify-between mb-6 pt-4">
                <button
                  onClick={() => setView('home')}
                  className="w-10 h-10 flex items-center justify-center border-2 border-black"
                  style={{ borderRadius: '8px' }}
                >
                  <ChevronLeft size={24} />
                </button>

                <h1 className="text-2xl font-bold" style={{ fontFamily: '"Outfit", sans-serif' }}>
                  Programlarım
                </h1>

                <div className="w-10" />
              </div>

              {/* Programs List */}
              <div className="space-y-4 mb-6">
                {programs.map((prog) => {
                  const isActive = prog.id === activeProgramId;
                  const totalExercises = prog.days.reduce((sum, day) => sum + day.exercises.length, 0);

                  return (
                    <div
                      key={prog.id}
                      className={`bg-white border-2 p-4 ${isActive ? 'border-black' : 'border-gray-300'}`}
                      style={{
                        borderRadius: '12px',
                        boxShadow: isActive ? '3px 3px 0px 0px rgba(0,0,0,1)' : 'none'
                      }}
                    >
                      <div className="flex items-start justify-between mb-2">
                        <div className="flex-1">
                          <h3 className="text-xl font-bold mb-1" style={{ fontFamily: '"Outfit", sans-serif' }}>
                            {prog.name}
                          </h3>
                          <p className="text-sm text-gray-500" style={{ fontFamily: '"Outfit", sans-serif' }}>
                            {totalExercises} egzersiz
                          </p>
                        </div>

                        <div className="flex items-center gap-1">
                          <button
                            onClick={() => duplicateProgram(prog)}
                            className="p-2 hover:bg-gray-50 rounded"
                            title="Kopyala"
                          >
                            <Copy size={18} />
                          </button>
                          {!isActive && (
                            <button
                              onClick={() => {
                                if (confirm(`"${prog.name}" programını silmek istediğinize emin misiniz?`)) {
                                  const updatedPrograms = programs.filter(p => p.id !== prog.id);
                                  if (updatedPrograms.length > 0) {
                                    savePrograms(updatedPrograms);
                                    if (activeProgramId === prog.id) {
                                      setActiveProgram(updatedPrograms[0].id);
                                    }
                                  } else {
                                    alert('En az bir program olmalı!');
                                  }
                                }
                              }}
                              className="p-2 hover:bg-red-50 rounded"
                            >
                              <Trash2 size={18} className="text-red-500" />
                            </button>
                          )}
                        </div>
                      </div>

                      {isActive ? (
                        <div className="bg-black text-white px-3 py-1 inline-block mt-2" style={{ borderRadius: '6px', fontFamily: '"Outfit", sans-serif', fontSize: '12px', fontWeight: '600' }}>
                          Aktif Program
                        </div>
                      ) : (
                        <button
                          onClick={() => {
                            setActiveProgram(prog.id);
                            setView('home');
                          }}
                          className="w-full bg-white border-2 border-black py-2 mt-2 hover:bg-gray-50"
                          style={{
                            borderRadius: '8px',
                            fontFamily: '"Outfit", sans-serif',
                            fontSize: '14px',
                            fontWeight: '600'
                          }}
                        >
                          Aktif Yap
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>

              {/* Add New Program Button */}
              <button
                onClick={() => {
                  setModalState({
                    isOpen: true,
                    title: 'Yeni Program Adı',
                    placeholder: `Program ${programs.length + 1}`,
                    initialValue: `Program ${programs.length + 1}`,
                    onConfirm: (programName) => {
                      if (programName) {
                        const newProgram = createDefaultProgram();
                        newProgram.name = programName;
                        newProgram.id = Date.now(); // Ensure unique ID
                        const updatedPrograms = [...programs, newProgram];
                        savePrograms(updatedPrograms);
                      }
                    }
                  });
                }}
                className="fixed bottom-6 left-4 right-4 bg-black text-white py-4 border-2 border-black hover:shadow-xl transition-shadow flex items-center justify-center gap-2"
                style={{
                  borderRadius: '12px',
                  fontFamily: '"Outfit", sans-serif',
                  fontSize: '16px',
                  fontWeight: '600',
                  boxShadow: '4px 4px 0px 0px rgba(0,0,0,1)'
                }}
              >
                <Plus size={20} />
                Yeni Program Ekle
              </button>
            </div>
          );
        }

        return null;
      };

      return (
        <div className="antialiased min-h-screen">
          {renderContent()}
          <Modal
            isOpen={modalState.isOpen}
            title={modalState.title}
            initialValue={modalState.initialValue}
            placeholder={modalState.placeholder}
            options={modalState.options}
            onClose={() => setModalState(prev => ({ ...prev, isOpen: false }))}
            onConfirm={(value) => {
              if (modalState.onConfirm) {
                modalState.onConfirm(value);
              }
              setModalState(prev => ({ ...prev, isOpen: false }));
            }}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WorkoutTracker />);
  </script>
</body>

</html>
